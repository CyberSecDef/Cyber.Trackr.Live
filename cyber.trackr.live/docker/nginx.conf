server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /app/public;

    # Symfony front controller: try the file, fall back to index.php.
    location / {
        # Security headers for static files (review S9). Requests that fall
        # through to index.php are internally redirected to the PHP location,
        # where these don't apply, and get the same set from
        # SecurityHeadersSubscriber. Keep in sync; SecurityHeadersTest checks.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        try_files $uri /index.php$is_args$args;
    }

    # Only index.php may run; everything else under .php is denied.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Large bulk-download (.zip / .docx) responses are streamed by PHP.
        fastcgi_read_timeout 300s;
        fastcgi_buffering off;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    client_max_body_size 16m;
    sendfile on;

    access_log /dev/stdout;
    error_log  /dev/stderr;
}

framework:
    rate_limiter:
        # Per-client-IP limit for the public JSON API. 120 req/min sustained
        # (~2/sec) is invisible to humans and normal API clients but throttles
        # bulk crawlers hard. Enforced by App\EventSubscriber\ApiRateLimitSubscriber.
        api:
            policy: 'sliding_window'
            limit: 120
            interval: '1 minute'
            # Single-VPS deployment: use the filesystem app cache for counters,
            # and no lock factory (avoids a hard dep on symfony/lock; the slight
            # imprecision under concurrency is irrelevant at this scale).
            cache_pool: 'cache.app'
            lock_factory: null
        # Per-client-IP limits on the heavy download routes (review S5).
        # Enforced by App\EventSubscriber\RouteRateLimitSubscriber.
        # A full-corpus bulk download is ~7-10 chunks, so 30/hour leaves room
        # for retries and a second selection.
        bulk_download:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
            cache_pool: 'cache.app'
            lock_factory: null
        # The air-gap image is ~3 GB. 10/hour rather than lower so download
        # managers that resume or split the file into Range requests still work.
        docker_image:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
            cache_pool: 'cache.app'
            lock_factory: null
        # AI mitigation statements (review S8). Only cache misses spend a
        # token. Per client IP, plus a site-wide cap that bounds Gemini spend
        # no matter how many addresses ask (prod saw ~70 requests in two
        # weeks, so 200/hour never touches real use).
        # /search/{query} (review S13). A broad term like "system" costs ~1 s
        # and up to 512 MB; prod's busiest searcher made 30 searches in two
        # weeks, so 30/minute never touches a person. Enforced by
        # App\EventSubscriber\RouteRateLimitSubscriber.
        search:
            policy: 'sliding_window'
            limit: 30
            interval: '1 minute'
            cache_pool: 'cache.app'
            lock_factory: null
        mitigation:
            policy: 'fixed_window'
            limit: 30
            interval: '1 hour'
            cache_pool: 'cache.app'
            lock_factory: null
        mitigation_global:
            policy: 'fixed_window'
            limit: 200
            interval: '1 hour'
            cache_pool: 'cache.app'
            lock_factory: null
